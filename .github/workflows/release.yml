name: Build and Release v1.0.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mini-web-counter-release-v1.0.1
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\Mini-Web-Counter.csproj

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish .\Mini-Web-Counter.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\publish

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* -DestinationPath .\Mini-Web-Counter-v1.0.1-win-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.1'
          $zip = '.\Mini-Web-Counter-v1.0.1-win-x64.zip'
          $exe = '.\publish\Mini-Web-Counter.exe'
          $target = (git rev-parse HEAD).Trim()

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }

          gh release create $tag $zip $exe --target $target --title 'Mini Web Counter v1.0.1' --notes '알림음이 다음 성공적인 폴링 전까지 반복 재생되도록 변경하고, 기본 프로그램명을 Mini Web Counter로 변경했습니다. 항목 순서 변경 기능과 MIT License를 추가했습니다. Windows 10/11 x64 self-contained 배포본입니다.'
