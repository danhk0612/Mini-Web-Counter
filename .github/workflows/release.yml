name: Build and Release v1.0.8

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mini-web-counter-release-v1.0.8
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\Mini-Web-Counter.csproj

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish .\Mini-Web-Counter.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\publish

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* -DestinationPath .\Mini-Web-Counter-v1.0.8-win-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.8'
          $zip = '.\Mini-Web-Counter-v1.0.8-win-x64.zip'
          $exe = '.\publish\Mini-Web-Counter.exe'
          $target = (git rev-parse HEAD).Trim()

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }

          gh release create $tag $zip $exe --target $target --title 'Mini Web Counter v1.0.8' --notes '설정에 Windows 시작 시 자동 실행 토글을 추가했습니다. 사용자 계정의 시작프로그램 레지스트리에 현재 EXE 경로를 등록/해제하며, 프로그램 시작 시에도 현재 경로로 동기화합니다. Windows 10/11 x64 self-contained 배포본입니다.'
