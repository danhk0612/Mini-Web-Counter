name: Build and Release v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jcms-release-v1.0.0
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hide link icon when URL is empty
        shell: pwsh
        run: |
          $path = 'MainForm.cs'
          $text = Get-Content $path -Raw -Encoding UTF8

          $pattern1 = 'var hasSound = !string\.IsNullOrWhiteSpace\(item\.SoundFile\);\s*var iconCount = hasSound \? 2 : 1;'
          $replacement1 = @'
          var hasLink = !string.IsNullOrWhiteSpace(item.LinkUrl);
          var hasSound = !string.IsNullOrWhiteSpace(item.SoundFile);
          var iconCount = (hasLink ? 1 : 0) + (hasSound ? 1 : 0);
          '@.Trim()
          $text = [regex]::Replace($text, $pattern1, $replacement1)

          $pattern2 = '(?s)var iconX = cardWidth - sidePadding - iconSize;\s*var linkIcon = CreateIconPanel\(iconX, Scale\(4, scale\), iconSize\);\s*linkIcon\.Cursor = string\.IsNullOrWhiteSpace\(item\.LinkUrl\) \? Cursors\.Default : Cursors\.Hand;\s*linkIcon\.Paint \+= \(_, e\) => DrawLinkIcon\(e\.Graphics, linkIcon\.ClientRectangle, textColor, scale\);\s*linkIcon\.Click \+= \(_, _\) => OpenItemLink\(item\.LinkUrl\);\s*panel\.Controls\.Add\(linkIcon\);\s*Panel\? soundIcon = null;\s*if \(hasSound\)\s*\{\s*iconX -= iconSize \+ iconGap;'
          $replacement2 = @'
          var iconX = cardWidth - sidePadding - iconSize;
          if (hasLink)
          {
              var linkIcon = CreateIconPanel(iconX, Scale(4, scale), iconSize);
              linkIcon.Cursor = Cursors.Hand;
              linkIcon.Paint += (_, e) => DrawLinkIcon(e.Graphics, linkIcon.ClientRectangle, textColor, scale);
              linkIcon.Click += (_, _) => OpenItemLink(item.LinkUrl);
              panel.Controls.Add(linkIcon);
          }

          Panel? soundIcon = null;
          if (hasSound)
          {
              if (hasLink)
              {
                  iconX -= iconSize + iconGap;
              }
          '@.Trim()
          $text = [regex]::Replace($text, $pattern2, $replacement2)

          if ($text -notmatch 'var hasLink = !string\.IsNullOrWhiteSpace\(item\.LinkUrl\);' -or $text -notmatch 'if \(hasLink\)') {
            throw 'Link icon conditional patch failed.'
          }

          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, [System.Text.UTF8Encoding]::new($false))

          if (git diff --quiet -- MainForm.cs) {
            Write-Host 'MainForm.cs already up to date.'
          } else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add MainForm.cs
            git commit -m 'Hide link icon when URL is empty [skip ci]'
            git push origin HEAD:main
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish .\JCMS_Mini_Monitoring.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\publish

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* -DestinationPath .\JCMS_Mini_Counter-v1.0.0-win-x64.zip -Force

      - name: Recreate GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0'
          $zip = '.\JCMS_Mini_Counter-v1.0.0-win-x64.zip'
          $exe = '.\publish\JCMS_Mini_Monitoring.exe'
          $target = (git rev-parse HEAD).Trim()

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }

          gh release create $tag $zip $exe --target $target --title 'JCMS 미니 카운터 v1.0.0' --notes '첫 배포 버전. Windows 10/11 x64용 self-contained 빌드이며 .NET 런타임 별도 설치가 필요하지 않습니다.'
