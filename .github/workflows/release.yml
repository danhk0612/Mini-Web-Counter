name: Build and Release v1.1.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mini-web-counter-release-v1.1.0
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release v1.1.0]')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore .\Mini-Web-Counter.csproj -r win-x64

      - name: Publish framework-dependent app
        shell: pwsh
        run: |
          dotnet publish .\Mini-Web-Counter.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --no-restore `
            -o .\publish-app

      - name: Stage application files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\publish -Force | Out-Null
          Copy-Item .\publish-app\Mini-Web-Counter.App.exe .\publish\Mini-Web-Counter.App.exe -Force
          Copy-Item .\publish-app\appsettings.json .\publish\appsettings.json -Force

      - name: Build native launcher
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          pushd Launcher
          rc /nologo /fo launcher.res launcher.rc
          cl /nologo /std:c++17 /O2 /EHsc /MT /DUNICODE /D_UNICODE MiniWebCounterLauncher.cpp launcher.res /Fe:..\publish\Mini-Web-Counter.exe /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib advapi32.lib
          popd

      - name: Validate package
        shell: pwsh
        run: |
          $requiredFiles = @(
            '.\publish\Mini-Web-Counter.exe',
            '.\publish\Mini-Web-Counter.App.exe',
            '.\publish\appsettings.json'
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Missing required package file: $file"
            }
          }

          if (Test-Path '.\publish-app\hostfxr.dll') {
            throw 'Framework-dependent publish unexpectedly contains hostfxr.dll.'
          }

          Get-ChildItem .\publish | Select-Object Name, Length

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* -DestinationPath .\Mini-Web-Counter-v1.1.0-win-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.1.0'
          $zip = '.\Mini-Web-Counter-v1.1.0-win-x64.zip'
          $target = (git rev-parse HEAD).Trim()

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }

          gh release create $tag $zip --target $target --title 'Mini Web Counter v1.1.0' --notes '배포 구조를 .NET 10 framework-dependent single-file로 변경하고, .NET 10 Desktop Runtime (x64) 설치 여부를 확인하는 네이티브 런처를 추가했습니다. 런타임이 없으면 Microsoft 공식 다운로드 페이지를 안내합니다. 기존 카운터·트레이·설정·오디오 기능은 유지되며 Windows 시작 시 자동 실행도 런처를 통해 동작합니다. 배포본은 ZIP 하나로 제공됩니다.'
