name: Build and Release v1.0.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mini-web-counter-release-v1.0.1
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply polling audio behavior
        shell: pwsh
        run: |
          $path = 'MainForm.cs'
          $text = Get-Content $path -Raw -Encoding UTF8
          $text = [regex]::Replace($text, '_audioPlaybackService\.Play\(item\.ValueName, path\);', '_audioPlaybackService.PlayLooping(item.ValueName, path);')
          $text = [regex]::Replace(
            $text,
            '_statusData = data;\r?\n(?<indent>\s*)UpdateValues\(\);',
            { param($m) "_statusData = data;`r`n$($m.Groups['indent'].Value)_audioPlaybackService.StopAll();`r`n$($m.Groups['indent'].Value)UpdateValues();" }
          )

          if ($text -notmatch 'PlayLooping\(item\.ValueName, path\)' -or $text -notmatch '_audioPlaybackService\.StopAll\(\);') {
            throw 'Polling audio patch failed.'
          }

          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, [System.Text.UTF8Encoding]::new($false))

          if (-not (git diff --quiet -- MainForm.cs)) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add MainForm.cs
            git commit -m 'Loop alert audio until next poll [skip ci]'
            git push origin HEAD:main
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish .\JCMS_Mini_Monitoring.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\publish

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* -DestinationPath .\Mini-Web-Counter-v1.0.1-win-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.1'
          $zip = '.\Mini-Web-Counter-v1.0.1-win-x64.zip'
          $exe = '.\publish\JCMS_Mini_Monitoring.exe'
          $target = (git rev-parse HEAD).Trim()

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }

          gh release create $tag $zip $exe --target $target --title 'Mini Web Counter v1.0.1' --notes '알림음이 다음 성공적인 폴링 전까지 반복 재생되도록 변경하고, 기본 프로그램명을 Mini Web Counter로 변경했습니다. 항목 순서 변경 기능과 MIT License를 추가했습니다. Windows 10/11 x64 self-contained 배포본입니다.'
