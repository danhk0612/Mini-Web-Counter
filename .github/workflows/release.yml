name: Build and Release v1.0.12

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mini-web-counter-release-v1.0.12
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\Mini-Web-Counter.csproj -r win-x64

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish .\Mini-Web-Counter.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --no-restore `
            -o .\publish

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* -DestinationPath .\Mini-Web-Counter-v1.0.12-win-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.12'
          $zip = '.\Mini-Web-Counter-v1.0.12-win-x64.zip'
          $exe = '.\publish\Mini-Web-Counter.exe'
          $target = (git rev-parse HEAD).Trim()

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }

          gh release create $tag $zip $exe --target $target --title 'Mini Web Counter v1.0.12' --notes '오디오 엔진을 NAudio/WASAPI 기반으로 변경하고 전체 볼륨, 항목별 개별 볼륨, 출력 사운드 장치 선택 기능을 추가했습니다. 같은 장치·같은 파일의 활성 알림은 볼륨 변경 시 재시작하지 않고 연속 재생을 유지하며, 선택한 출력 장치를 찾을 수 없으면 Windows 기본 출력 장치로 자동 대체합니다. 기존 카운트 0/1 이상에 따른 소리·깜박임 규칙도 유지됩니다. Windows 10/11 x64 self-contained 배포본입니다.'
