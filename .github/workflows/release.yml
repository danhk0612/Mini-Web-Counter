name: Build and Release v1.0.9

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mini-web-counter-release-v1.0.9
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\Mini-Web-Counter.csproj

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish .\Mini-Web-Counter.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\publish

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* -DestinationPath .\Mini-Web-Counter-v1.0.9-win-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.9'
          $zip = '.\Mini-Web-Counter-v1.0.9-win-x64.zip'
          $exe = '.\publish\Mini-Web-Counter.exe'
          $target = (git rev-parse HEAD).Trim()

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }

          gh release create $tag $zip $exe --target $target --title 'Mini Web Counter v1.0.9' --notes '설정 상단 옵션을 두 줄로 재배치해 Windows 시작 시 자동 실행 토글이 화면 밖으로 밀려 보이지 않던 문제를 수정했습니다. 표시 옵션과 비활성/시작 옵션을 분리해 DPI 및 창 너비 변화에도 안정적으로 보이도록 개선했습니다. Windows 10/11 x64 self-contained 배포본입니다.'
