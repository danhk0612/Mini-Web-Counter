name: Normalize Mini Web Counter branding

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-branding.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize project names
        shell: pwsh
        run: |
          if (Test-Path 'JCMS_Mini_Monitoring.csproj') {
            git mv 'JCMS_Mini_Monitoring.csproj' 'Mini-Web-Counter.csproj'
          }

          $textFiles = Get-ChildItem -Recurse -File | Where-Object {
            $_.Extension -in '.cs', '.csproj', '.md', '.json' -and
            $_.FullName -notlike '*\.git\*' -and
            $_.FullName -notlike '*\.github\workflows\*'
          }

          foreach ($file in $textFiles) {
            $text = Get-Content $file.FullName -Raw -Encoding UTF8
            $updated = $text.Replace('JCMS_Mini_Monitoring', 'MiniWebCounter')
            $updated = $updated.Replace('JCMS 미니 카운터', 'Mini Web Counter')
            $updated = $updated.Replace('jcms_', 'mwc_')

            if ($updated -ne $text) {
              [System.IO.File]::WriteAllText($file.FullName, $updated, [System.Text.UTF8Encoding]::new($false))
            }
          }

          $projectPath = 'Mini-Web-Counter.csproj'
          $project = Get-Content $projectPath -Raw -Encoding UTF8
          $project = [regex]::Replace($project, '<AssemblyName>.*?</AssemblyName>', '<AssemblyName>Mini-Web-Counter</AssemblyName>')
          $project = [regex]::Replace($project, '<RootNamespace>.*?</RootNamespace>', '<RootNamespace>MiniWebCounter</RootNamespace>')
          [System.IO.File]::WriteAllText((Resolve-Path $projectPath), $project, [System.Text.UTF8Encoding]::new($false))

          $remaining = Get-ChildItem -Recurse -File | Where-Object {
            $_.FullName -notlike '*\.git\*' -and
            $_.FullName -notlike '*\.github\workflows\*'
          } | Select-String -Pattern 'JCMS_Mini_Monitoring|JCMS 미니 카운터|jcms_' -SimpleMatch:$false

          if ($remaining) {
            $remaining | ForEach-Object { Write-Host $_ }
            throw 'Legacy branding remains in project files.'
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build verification
        run: dotnet build .\Mini-Web-Counter.csproj -c Release

      - name: Commit project cleanup
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!/.github/workflows'
          git commit -m 'Normalize Mini Web Counter project naming'
          git push origin HEAD:main
