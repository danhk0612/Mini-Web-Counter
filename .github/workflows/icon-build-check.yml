name: Icon build check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/icon-build-check.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build .\Mini-Web-Counter.csproj -c Release
      - run: dotnet publish .\Mini-Web-Counter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish
      - shell: pwsh
        run: |
          if (-not (Test-Path '.\publish\Mini-Web-Counter.exe')) { throw 'Published EXE missing.' }
          Write-Host "Published EXE size: $((Get-Item '.\publish\Mini-Web-Counter.exe').Length)"
