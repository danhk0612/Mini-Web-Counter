name: Unify count audio flash behavior

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/unify-count-audio-flash.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        shell: pwsh
        run: pwsh -File .github/scripts/unify-count-audio-flash.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build .\Mini-Web-Counter.csproj -c Release
      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MainForm.cs Services/AudioPlaybackService.cs
          git commit -m 'Unify count audio and flash transitions'
          git push origin HEAD:main
