name: Add audio controls

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-audio-controls.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        shell: pwsh
        run: pwsh -File .github/scripts/add-audio-controls.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore .\Mini-Web-Counter.csproj
      - name: Build
        run: dotnet build .\Mini-Web-Counter.csproj -c Release --no-restore
      - name: Publish Windows x64 smoke test
        shell: pwsh
        run: dotnet publish .\Mini-Web-Counter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore -o .\publish-test
      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mini-Web-Counter.csproj Models/AppSettings.cs Models/MonitoringItem.cs Services/AudioPlaybackService.cs MainForm.cs SettingsForm.cs appsettings.json
          git commit -m 'Add volume controls and audio device selection'
          git push origin HEAD:main
