name: Apply icon UI update

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/icon-ui-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        shell: pwsh
        run: pwsh -File .github/scripts/update-icons.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build .\Mini-Web-Counter.csproj -c Release
      - name: Commit
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MainForm.cs
          git commit -m 'Improve card action icon states'
          git push origin HEAD:main
