name: Update card action icons

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/icon-ui-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update icon rendering
        shell: pwsh
        run: |
          $path = 'MainForm.cs'
          $text = Get-Content $path -Raw -Encoding UTF8

          $oldSound = @'
            soundIcon.Paint += (_, e) => DrawSoundIcon(
                e.Graphics,
                soundIcon.ClientRectangle,
                textColor,
                _mutedItems.Contains(item.ValueName),
                scale);
'@
          $newSound = @'
            soundIcon.Paint += (_, e) =>
            {
                var muted = _mutedItems.Contains(item.ValueName);
                var iconColor = muted ? Color.LightGray : textColor;
                DrawSoundIcon(
                    e.Graphics,
                    soundIcon.ClientRectangle,
                    iconColor,
                    muted,
                    scale);
            };
'@
          if (-not $text.Contains($oldSound)) { throw 'Sound icon block not found.' }
          $text = $text.Replace($oldSound, $newSound)

          $pattern = '(?ms)    private static void DrawLinkIcon\(Graphics graphics, Rectangle bounds, Color color, float scale\)\r?\n    \{.*?\r?\n    \}\r?\n\r?\n    private static void DrawSoundIcon'
          $replacement = @'
    private static void DrawLinkIcon(Graphics graphics, Rectangle bounds, Color color, float scale)
    {
        graphics.SmoothingMode = SmoothingMode.AntiAlias;
        using var pen = new Pen(color, Math.Max(1.4F, 1.6F * scale))
        {
            StartCap = LineCap.Round,
            EndCap = LineCap.Round,
            LineJoin = LineJoin.Round
        };

        var w = bounds.Width;
        var h = bounds.Height;

        // Browser/window outline.
        var windowRect = new RectangleF(w * 0.18F, h * 0.30F, w * 0.48F, h * 0.48F);
        graphics.DrawRectangle(pen, windowRect.X, windowRect.Y, windowRect.Width, windowRect.Height);

        // External-link arrow pointing to the upper-right.
        graphics.DrawLine(pen, w * 0.46F, h * 0.54F, w * 0.80F, h * 0.20F);
        graphics.DrawLine(pen, w * 0.61F, h * 0.20F, w * 0.80F, h * 0.20F);
        graphics.DrawLine(pen, w * 0.80F, h * 0.20F, w * 0.80F, h * 0.39F);
    }

    private static void DrawSoundIcon
'@
          $updated = [regex]::Replace($text, $pattern, $replacement)
          if ($updated -eq $text) { throw 'Link icon block replacement failed.' }

          [System.IO.File]::WriteAllText((Resolve-Path $path), $updated, [System.Text.UTF8Encoding]::new($false))

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build .\Mini-Web-Counter.csproj -c Release

      - name: Commit source change
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MainForm.cs
          git commit -m 'Improve card action icon states'
          git push origin HEAD:main
